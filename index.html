<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layar TV Antrian</title>
    <style>
        :root { --primary: #0f172a; --secondary: #1e293b; --accent: #3b82f6; --danger: #ef4444; --warning: #f59e0b;}
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { margin: 0; padding: 0; background-color: #e2e8f0; overflow: hidden; }
        
        .header { background: var(--primary); color: white; padding: 20px; text-align: center; font-size: 26px; font-weight: bold; }
        .tv-grid { display: grid; grid-template-columns: 2.2fr 1.2fr; gap: 20px; padding: 20px; height: 80vh; }
        
        .tv-media { background: white; border-radius: 12px; display: flex; flex-direction: column; position: relative; overflow: hidden; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); padding: 15px;}
        .tv-media img, .tv-media iframe { width: 100%; height: 100%; object-fit: cover; border: none; }
        
        .tv-right-panel { display: flex; flex-direction: column; gap: 15px; }
        .tv-card { background: white; padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); border: 5px solid var(--accent); flex: 1; display: flex; flex-direction: column; justify-content: center;}
        .tv-title { font-size: 24px; font-weight: bold; color: var(--secondary); margin-bottom: 10px;}
        .tv-number { font-size: 110px; font-weight: 900; color: var(--danger); line-height: 1; margin: 0;}
        .tv-loket { font-size: 32px; font-weight: bold; background: var(--primary); color: white; padding: 10px; border-radius: 12px; margin-top: 15px;}
        
        .loket-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
        .loket-box { background: var(--secondary); color: white; padding: 12px; border-radius: 10px; text-align: center; }
        .loket-box-title { font-size: 14px; font-weight: bold; color: #cbd5e1; }
        .loket-box-number { font-size: 32px; font-weight: bold; color: var(--warning); line-height: 1;}

        /* Styling Tabel Status Dokumen */
        .doc-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .doc-table th, .doc-table td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 16px; }
        .doc-table th { background: var(--primary); color: white; border-radius: 4px;}
        .badge { padding: 6px 12px; border-radius: 6px; font-weight: bold; font-size: 14px; color: white; display: inline-block; }
        .bg-operator { background: #64748b; }
        .bg-verifikasi { background: #3b82f6; }
        .bg-tte { background: #f59e0b; }
        .bg-selesai { background: #10b981; }

        .marquee { background: var(--primary); color: white; padding: 15px; font-size: 22px; position: fixed; bottom: 0; width: 100%; white-space: nowrap; }
        .marquee span { display: inline-block; animation: scroll 20s linear infinite; }
        @keyframes scroll { from { transform: translateX(100vw); } to { transform: translateX(-100%); } }
    </style>
</head>
<body>

    <div class="header">🏢 KELURAHAN CIBEUREUM</div>
    
    <div class="tv-grid">
        <!-- Media Kiri (Tabel Dokumen / Gambar / Video) -->
        <div id="media-container" class="tv-media">
            <h2>Memuat Media...</h2>
        </div>
        
        <!-- Panggilan Kanan -->
        <div class="tv-right-panel">
            <div class="tv-card">
                <div class="tv-title">SEDANG DIPANGGIL</div>
                <div id="tv-number" class="tv-number">A0</div>
                <div id="tv-loket" class="tv-loket">Menunggu...</div>
            </div>
            <div id="loket-grid" class="loket-grid"></div>
        </div>
    </div>
    
    <div class="marquee"><span id="tv-marquee">Memuat Informasi...</span></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDciXMHMtqypmfhLw2am_GAn3FV1bBjcKo",
            authDomain: "antrian-cibeureum-f125b.firebaseapp.com",
            databaseURL: "https://antrian-cibeureum-f125b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "antrian-cibeureum-f125b"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let daftarLoket = [];
        let statusLoket = {};

        // Settings Listener
        onValue(ref(db, 'cibeureum_settings'), snapshot => {
            let data = snapshot.val();
            if(!data) return;

            document.getElementById('tv-marquee').innerText = data.marquee || "Selamat Datang";
            if(data.lokets) { daftarLoket = data.lokets; renderLoketGrid(); }
            if(data.media) renderMedia(data.media);
        });

        // Queue Listener
        onValue(ref(db, 'cibeureum_queue'), snapshot => {
            let data = snapshot.val();
            if(data) {
                document.getElementById('tv-number').innerText = data.displayCode || 'A0';
                document.getElementById('tv-loket').innerText = data.call > 0 ? data.loket : 'Menunggu...';
                statusLoket = data.status || {};
                renderLoketGrid();
            }
        });

        // Status Dokumen Listener (Real-time update ke TV jika dipilih)
        function listenDokumen() {
            onValue(ref(db, 'cibeureum_dokumen'), snapshot => {
                let data = snapshot.val();
                let container = document.getElementById('media-container');
                
                let html = `
                    <h2 style="margin:0 0 10px 0; color:#0f172a; border-bottom:2px solid #e2e8f0; padding-bottom:10px;">📋 STATUS DOKUMEN PERMOHONAN WARGA</h2>
                    <table class="doc-table">
                        <thead>
                            <tr>
                                <th>Nama Pemohon</th>
                                <th>Layanan</th>
                                <th>Status Proses</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                if(!data) {
                    html += `<tr><td colspan="3" style="text-align:center;">Belum ada data permohonan.</td></tr>`;
                } else {
                    Object.keys(data).forEach(key => {
                        let item = data[key];
                        let badgeClass = 'bg-operator';
                        if(item.status === 'Verifikasi') badgeClass = 'bg-verifikasi';
                        if(item.status === 'Menunggu TTE') badgeClass = 'bg-tte';
                        if(item.status === 'Selesai') badgeClass = 'bg-selesai';

                        html += `
                            <tr>
                                <td><b>${item.nama}</b></td>
                                <td>${item.layanan}</td>
                                <td><span class="badge ${badgeClass}">${item.status}</span></td>
                            </tr>
                        `;
                    });
                }

                html += `</tbody></table>`;
                container.innerHTML = html;
            });
        }

        function renderLoketGrid() {
            let grid = document.getElementById('loket-grid');
            grid.innerHTML = '';
            daftarLoket.forEach(loket => {
                let val = statusLoket[loket] || '--';
                grid.innerHTML += `
                    <div class="loket-box">
                        <div class="loket-box-title">${loket}</div>
                        <div class="loket-box-number">${val}</div>
                    </div>
                `;
            });
        }

        function renderMedia(mediaData) {
            let container = document.getElementById('media-container');
            if(mediaData.type === 'status_dokumen') {
                listenDokumen();
            } else if (mediaData.type === 'youtube') {
                container.innerHTML = `<iframe src="https://www.youtube.com/embed/${mediaData.content}?autoplay=1&mute=1&loop=1&playlist=${mediaData.content}"></iframe>`;
            } else if (mediaData.type === 'gslides') {
                container.innerHTML = `<iframe src="${mediaData.content}"></iframe>`;
            } else if (mediaData.type === 'images') {
                container.innerHTML = `<img src="${mediaData.content.split(',')[0]}">`;
            }
        }
    </script>
</body>
</html>
