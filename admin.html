<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Loket Antrian</title>
    <link rel="manifest" href="manifest-admin.json">
    <meta name="theme-color" content="#3b82f6">
    <style>
        body { font-family: sans-serif; background: #e2e8f0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; margin: 0; padding:20px;}
        .admin-card { background: white; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; margin-bottom: 20px;}
        .admin-btn { width: 100%; padding: 15px; font-size: 18px; font-weight: bold; border: none; border-radius: 12px; cursor: pointer; margin-top: 10px; color: white;}
        .admin-btn:disabled { background: #cbd5e1 !important; }
        .btn-call { background: #3b82f6; } .btn-recall { background: #f59e0b; } .btn-reset { background: #ef4444; margin-top: 20px;}
        select { width: 100%; padding: 12px; font-size: 18px; border-radius: 8px; border: 2px solid #cbd5e1; margin-bottom: 15px; font-weight: bold;}
        .info-box { background: #f1f5f9; padding: 15px; border-radius: 12px; margin: 20px 0; border: 1px solid #e2e8f0; }
        .btn-track { padding: 8px 10px; border: none; border-radius: 6px; font-weight: bold; font-size:12px; cursor: pointer; color: white;}
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>Panel Pemanggil Loket</h2>
        <select id="pilihan-loket"></select>
        <select id="pilihan-kode" onchange="updateInfoSelanjutnya()"></select>

        <h1 style="color: #3b82f6; font-size:75px; margin: 10px 0;" id="admin-current">--</h1>
        
        <button id="btnCall" class="admin-btn btn-call" onclick="panggilSelanjutnya()">📢 Panggil Selanjutnya</button>
        <button id="btnRecall" class="admin-btn btn-recall" onclick="panggilUlang()">🔄 Panggil Ulang</button>
        
        <div class="info-box">
            <span style="color:#64748b; font-size:14px; font-weight:bold;">Menunggu Antrian Berikutnya:</span><br>
            <strong id="admin-next" style="font-size:28px; color:#10b981;">--</strong>
        </div>
        <button class="admin-btn btn-reset" onclick="resetSemua()">⚠️ Reset Semua Antrian</button>
    </div>

    <div class="admin-card" style="text-align: left;">
        <h3 style="margin-top: 0; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">📋 Update Proses Berkas & Timer 45 Menit</h3>
        <div id="tracking-list" style="display: flex; flex-direction: column; gap: 15px;"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDciXMHMtqypmfhLw2am_GAn3FV1bBjcKo",
            authDomain: "antrian-cibeureum-f125b.firebaseapp.com",
            databaseURL: "https://antrian-cibeureum-f125b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "antrian-cibeureum-f125b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        let qData = { totals: {}, calls: {}, status: {} };

        onValue(ref(db, 'cibeureum_settings'), snapshot => {
            let data = snapshot.val() || {};
            let lSelect = document.getElementById('pilihan-loket'); lSelect.innerHTML = '';
            (data.lokets || ["Loket 1"]).forEach(l => lSelect.innerHTML += `<option value="${l}">${l}</option>`);
            let kSelect = document.getElementById('pilihan-kode'); kSelect.innerHTML = '';
            (data.kodes || [{kode:"A", nama:"Umum"}]).forEach(k => kSelect.innerHTML += `<option value="${k.kode}">Kode ${k.kode}</option>`);
            updateInfoSelanjutnya();
        });

        onValue(ref(db, 'cibeureum_queue'), snapshot => {
            let data = snapshot.val();
            if(data) {
                qData = data;
                document.getElementById('admin-current').innerText = data.displayCode || '--';
                updateInfoSelanjutnya();
            }
        });

        onValue(ref(db, 'cibeureum_tracking'), snapshot => {
            let data = snapshot.val();
            let container = document.getElementById('tracking-list');
            container.innerHTML = '';

            if(data) {
                let sorted = Object.keys(data).map(k => ({ nomor: k, ...data[k] })).sort((a, b) => b.timestamp - a.timestamp);

                sorted.forEach(item => {
                    if (item.status === 'Selesai') return;
                    
                    container.innerHTML += `
                        <div style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #cbd5e1;">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <strong style="font-size: 20px;">${item.nomor}</strong>
                                <span style="background:#e0f2fe; color:#0369a1; padding:4px 8px; border-radius:6px; font-weight:bold; font-size:14px;">Estimasi: ${item.estimasi || '-'}</span>
                            </div>
                            <p style="margin:5px 0 10px 0; color:#3b82f6; font-weight:bold;">Status: ${item.status}</p>
                            
                            <div style="margin-top: 10px; display: flex; gap: 5px; flex-wrap: wrap;">
                                <button onclick="updateStatus('${item.nomor}', 'Input Operator', true)" class="btn-track" style="background:#3b82f6;">Input Operator (Mulai Timer)</button>
                                <button onclick="updateStatus('${item.nomor}', 'Verifikasi', false)" class="btn-track" style="background:#f59e0b;">Verifikasi</button>
                                <button onclick="updateStatus('${item.nomor}', 'Menunggu TTE', false)" class="btn-track" style="background:#6366f1;">Menunggu TTE</button>
                                <button onclick="updateStatus('${item.nomor}', 'Selesai', false)" class="btn-track" style="background:#10b981;">✅ Selesai</button>
                            </div>
                        </div>
                    `;
                });
            } else { container.innerHTML = '<p style="color:gray;">Belum ada dokumen yang diproses.</p>'; }
        });

        // FUNGSI UPDATE STATUS & TIMER 45 MENIT OTOMATIS
        window.updateStatus = function(nomor, statusBaru, isMulaiTimer) {
            let updateData = { status: statusBaru };
            
            // Jika admin klik "Input Operator", set target waktu selesai 45 menit dari sekarang
            if (isMulaiTimer) {
                let targetTime = Date.now() + (45 * 60 * 1000); // 45 Menit dlm milidetik
                updateData.targetTime = targetTime;
            }

            // Update ke node spesifik
            for (let key in updateData) {
                set(ref(db, `cibeureum_tracking/${nomor}/${key}`), updateData[key]);
            }
        }

        window.updateInfoSelanjutnya = function() {
            let kode = document.getElementById('pilihan-kode').value;
            if(!kode) return;
            let currentCall = (qData.calls && qData.calls[kode]) ? qData.calls[kode] : 0;
            let totalPrinted = (qData.totals && qData.totals[kode]) ? qData.totals[kode] : 0;
            let textNext = document.getElementById('admin-next');
            if (currentCall + 1 <= totalPrinted) {
                textNext.innerText = kode + (currentCall + 1);
                textNext.style.color = "#10b981"; 
            } else {
                textNext.innerText = "Belum Ada Pendaftar";
                textNext.style.color = "#ef4444"; 
            }
        }

        window.panggilSelanjutnya = function() {
            let kode = document.getElementById('pilihan-kode').value;
            let loket = document.getElementById('pilihan-loket').value;
            if(!qData.calls) qData.calls = {};
            let nextNo = (qData.calls[kode] || 0) + 1;
            let maxNo = (qData.totals && qData.totals[kode]) ? qData.totals[kode] : 0;

            if(nextNo <= maxNo) {
                let fullCode = kode + nextNo;
                qData.calls[kode] = nextNo;
                qData.displayCode = fullCode;
                qData.loket = loket; qData.call = nextNo;
                if(!qData.status) qData.status = {};
                qData.status[loket] = fullCode;
                qData.timestamp = Date.now();

                set(ref(db, 'cibeureum_queue'), qData);
                // Status awal saat dipanggil
                set(ref(db, `cibeureum_tracking/${fullCode}`), { status: "Pemeriksaan Berkas", estimasi: "-", targetTime: null, timestamp: Date.now() });
                
                mainkanSuara(kode, nextNo, loket);
            } else { alert("Antrian kosong!"); }
        }

        window.panggilUlang = function() {
            if(qData.displayCode && qData.displayCode !== '--') {
                let loket = document.getElementById('pilihan-loket').value;
                qData.timestamp = Date.now(); qData.loket = loket; 
                set(ref(db, 'cibeureum_queue'), qData); 
                mainkanSuara(document.getElementById('pilihan-kode').value, qData.call, loket);
            }
        }

        window.resetSemua = function() {
            if(confirm("Yakin mereset sistem?")) {
                set(ref(db, 'cibeureum_queue'), { totals: {}, calls: {}, status: {}, displayCode: "A0", timestamp: Date.now() });
                set(ref(db, 'cibeureum_tracking'), null);
            }
        }

        function mainkanSuara(kode, nomor, loket) {
            let b1 = document.getElementById('btnCall'), b2 = document.getElementById('btnRecall');
            b1.disabled = true; b2.disabled = true;

            let audio = new Audio('dingdong.mp3');
            audio.play().then(() => {
                let durasiMs = audio.duration * 1000;
                let waktuTunggu = (durasiMs > 2000) ? (durasiMs - 2000) : 0;
                setTimeout(() => {
                    let teks = `Nomor Antrian, ${kode}, ${terbilang(nomor)}, Silakan menuju, ${loket}.`;
                    let ucapan = new SpeechSynthesisUtterance(teks);
                    ucapan.lang = 'id-ID'; ucapan.rate = 0.85;
                    ucapan.onend = () => { b1.disabled = false; b2.disabled = false; };
                    window.speechSynthesis.speak(ucapan);
                }, waktuTunggu);
            }).catch(() => { b1.disabled = false; b2.disabled = false; });
        }

        function terbilang(n) {
            let b = ["", "satu", "dua", "tiga", "empat", "lima", "enam", "tujuh", "delapan", "sembilan", "sepuluh", "sebelas"];
            if (n < 12) return b[n];
            if (n < 20) return b[n - 10] + " belas";
            if (n < 100) return b[Math.floor(n / 10)] + " puluh" + (n % 10 > 0 ? " " + b[n % 10] : "");
            return n;
        }
    </script>
</body>
</html>
