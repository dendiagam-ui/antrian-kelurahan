<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Sistem Antrian</title>
    <style>
        :root { --primary: #0f172a; --accent: #3b82f6; --success: #10b981; --danger: #ef4444; }
        body { font-family: sans-serif; background: #f1f5f9; margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: white; padding: 25px; border-radius: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .form-group { margin-bottom: 18px; }
        label { font-weight: bold; display: block; margin-bottom: 6px; }
        input, select, textarea { width: 100%; padding: 10px 14px; font-size: 15px; border: 2px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        .flex-row { display: flex; gap: 10px; margin-bottom: 8px; }
        .btn-del { background: var(--danger); color: white; border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-add { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px;}
        .btn-save { background: var(--success); color: white; border: none; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
        .alert { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; display: none; font-weight: bold;}
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; margin-bottom: 20px;">⚙️ Panel Pengaturan Sistem</h2>
        <div id="alertSuccess" class="alert">✅ Pengaturan Berhasil Disimpan!</div>

        <div class="card">
            <h3>🖨️ Pengaturan Cetak Struk Tiket</h3>
            <div class="form-group"><label>Judul Utama Struk</label><input type="text" id="struk-header" placeholder="KELURAHAN CIBEUREUM"></div>
            <div class="form-group"><label>Subjudul Struk</label><input type="text" id="struk-sub" placeholder="Pelayanan Masyarakat"></div>
            <div class="form-group"><label>Pesan Footer</label><input type="text" id="struk-footer" placeholder="Terima kasih"></div>
        </div>

        <div class="card">
            <h3>🏷️ Kode & Kategori Antrian</h3>
            <div id="kode-container"></div>
            <button class="btn-add" onclick="tambahKode('', '')">➕ Tambah Kode Baru</button>
        </div>

        <div class="card">
            <h3>🚪 Daftar Loket Pelayanan</h3>
            <div id="loket-container"></div>
            <button class="btn-add" onclick="tambahLoket('')">➕ Tambah Loket Baru</button>
        </div>

        <div class="card">
            <h3>📺 Tampilan Layar TV</h3>
            <div class="form-group">
                <label>Media Bagian Kiri TV</label>
                <select id="media-type">
                    <option value="status_dokumen">📋 Tabel Pelacakan Status Berkas Real-time</option>
                    <option value="images">🖼️ Slideshow Gambar</option>
                    <option value="youtube">📺 Video YouTube (Auto-Play)</option>
                    <option value="gslides">📊 Google Slides (PPT)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Link / Konten Media (Abaikan jika memilih Tabel Status)</label>
                <textarea id="media-content" rows="2" placeholder="Masukkan ID YouTube / Link Gambar..."></textarea>
            </div>
            <div class="form-group">
                <label>Teks Berjalan (Marquee)</label>
                <textarea id="setting-marquee" rows="2"></textarea>
            </div>
        </div>

        <button class="btn-save" onclick="simpanSistem()">💾 SIMPAN SEMUA PENGATURAN</button>
        <a href="/" style="display:block; text-align:center; margin-top:20px; color:#3b82f6; text-decoration:none;">⬅️ Kembali ke TV</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDciXMHMtqypmfhLw2am_GAn3FV1bBjcKo",
            authDomain: "antrian-cibeureum-f125b.firebaseapp.com",
            databaseURL: "https://antrian-cibeureum-f125b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "antrian-cibeureum-f125b"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.tambahKode = function(kode, nama) {
            let container = document.getElementById('kode-container');
            container.innerHTML += `<div class="flex-row"><input type="text" class="input-kode" placeholder="Kode (A/B)" value="${kode}" style="width:30%;"><input type="text" class="input-nama-kode" placeholder="Nama Layanan" value="${nama}" style="width:70%;"><button class="btn-del" onclick="this.parentElement.remove()">X</button></div>`;
        }
        window.tambahLoket = function(nama) {
            let container = document.getElementById('loket-container');
            container.innerHTML += `<div class="flex-row"><input type="text" class="input-loket" placeholder="Nama Loket" value="${nama}"><button class="btn-del" onclick="this.parentElement.remove()">X</button></div>`;
        }

        get(ref(db, 'cibeureum_settings')).then(snapshot => {
            let data = snapshot.val() || {};
            document.getElementById('struk-header').value = data.struk?.header || "KELURAHAN CIBEUREUM";
            document.getElementById('struk-sub').value = data.struk?.sub || "Pemerintah Kota";
            document.getElementById('struk-footer').value = data.struk?.footer || "Budayakan Antri";
            document.getElementById('setting-marquee').value = data.marquee || "Selamat Datang";
            if(data.media) {
                document.getElementById('media-type').value = data.media.type || "status_dokumen";
                document.getElementById('media-content').value = data.media.content || "";
            }
            (data.kodes || [{kode: "A", nama: "Umum"}]).forEach(k => tambahKode(k.kode, k.nama));
            (data.lokets || ["Loket 1"]).forEach(l => tambahLoket(l));
        });

        window.simpanSistem = function() {
            let kodesArr = [];
            document.querySelectorAll('#kode-container .flex-row').forEach(row => {
                let k = row.querySelector('.input-kode').value.toUpperCase().trim();
                let n = row.querySelector('.input-nama-kode').value.trim();
                if(k && n) kodesArr.push({ kode: k, nama: n });
            });
            let loketsArr = [];
            document.querySelectorAll('#loket-container .input-loket').forEach(inp => {
                let val = inp.value.trim();
                if(val) loketsArr.push(val);
            });
            if(kodesArr.length === 0 || loketsArr.length === 0) return alert("Kode dan Loket minimal 1!");

            set(ref(db, 'cibeureum_settings'), {
                struk: { header: document.getElementById('struk-header').value, sub: document.getElementById('struk-sub').value, footer: document.getElementById('struk-footer').value },
                kodes: kodesArr, lokets: loketsArr, marquee: document.getElementById('setting-marquee').value,
                media: { type: document.getElementById('media-type').value, content: document.getElementById('media-content').value }
            }).then(() => {
                document.getElementById('alertSuccess').style.display = 'block';
                setTimeout(() => document.getElementById('alertSuccess').style.display = 'none', 3000);
            });
        }
    </script>
</body>
</html>
