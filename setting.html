<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengaturan Sistem Antrian</title>
    <style>
        body { font-family: sans-serif; background: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px;}
        .setting-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        .form-group { margin-bottom: 25px; background: #f8fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0;}
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #1e293b; }
        select, textarea, input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 8px; box-sizing: border-box; }
        .help-text { font-size: 13px; color: #64748b; margin-top: 5px; display: block; }
        .btn-save { background: #10b981; color: white; border: none; padding: 15px; font-size: 18px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; transition: 0.2s; margin-top: 10px;}
        .btn-save:hover { background: #059669; }
        
        .loket-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn-remove { background: #ef4444; color: white; border: none; padding: 0 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .btn-add { background: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; }
        
        .alert { background: #d1fae5; color: #065f46; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; display: none; font-weight: bold;}
    </style>
</head>
<body>

    <div class="setting-card">
        <h2 style="text-align: center; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; margin-top:0;">⚙️ Pengaturan Sistem</h2>
        
        <div id="alertSuccess" class="alert">✅ Pengaturan berhasil disimpan! Sistem akan otomatis berubah.</div>

        <!-- PENGATURAN TEKS BERJALAN -->
        <div class="form-group">
            <label>Teks Berjalan (Marquee) TV</label>
            <textarea id="setting-marquee" rows="3" placeholder="Masukkan teks info/pengumuman..."></textarea>
        </div>

        <!-- PENGATURAN LOKET -->
        <div class="form-group">
            <label>Pengaturan Loket</label>
            <span class="help-text" style="margin-bottom:10px;">Loket yang ditambahkan di sini akan otomatis membuat kolom baru di Layar TV dan Panel Admin.</span>
            <div id="loket-container">
                <!-- Baris loket akan di-generate via JS -->
            </div>
            <button class="btn-add" onclick="tambahBarisLoket('')">➕ Tambah Loket Baru</button>
        </div>

        <!-- PENGATURAN MEDIA -->
        <div class="form-group">
            <label>Media Layar TV</label>
            <select id="media-type" style="margin-bottom: 10px;" onchange="changeHelpText()">
                <option value="images">🖼️ Slideshow Gambar (Otomatis)</option>
                <option value="youtube">📺 Video YouTube (Auto-Play)</option>
                <option value="gslides">📊 Google Slides (PPT)</option>
            </select>
            <textarea id="media-content" rows="3" placeholder="Masukkan link..."></textarea>
            <span id="help-text" class="help-text"></span>
        </div>

        <button class="btn-save" onclick="simpanPengaturan()">💾 SIMPAN PENGATURAN</button>
        <a href="/" style="display:block; text-align:center; margin-top:20px; color:#3b82f6; text-decoration:none;">⬅️ Kembali ke TV</a>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDciXMHMtqypmfhLw2am_GAn3FV1bBjcKo",
            authDomain: "antrian-cibeureum-f125b.firebaseapp.com",
            databaseURL: "https://antrian-cibeureum-f125b-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "antrian-cibeureum-f125b",
            storageBucket: "antrian-cibeureum-f125b.firebasestorage.app",
            messagingSenderId: "715978413563",
            appId: "1:715978413563:web:31c62bd0430bbb3e6ee75e"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const settingsRef = ref(db, 'cibeureum_settings');

        // Fungsi Menambah Kolom Input Loket
        window.tambahBarisLoket = function(nilai) {
            const container = document.getElementById('loket-container');
            const div = document.createElement('div');
            div.className = 'loket-row';
            div.innerHTML = `
                <input type="text" class="loket-input" placeholder="Nama Loket (Contoh: Loket 1)" value="${nilai}">
                <button class="btn-remove" onclick="this.parentElement.remove()">X</button>
            `;
            container.appendChild(div);
        }

        // Ambil Data Saat Ini
        get(settingsRef).then((snapshot) => {
            let data = snapshot.val();
            
            // Set Marquee
            document.getElementById('setting-marquee').value = data?.marquee || "Selamat Datang di Pusat Pelayanan Masyarakat Kelurahan Cibeureum.";
            
            // Set Media
            if(data?.media) {
                document.getElementById('media-type').value = data.media.type;
                document.getElementById('media-content').value = data.media.content;
            }
            window.changeHelpText();

            // Set Daftar Loket
            let daftarLoket = data?.lokets || ["Loket 1", "Loket 2"];
            daftarLoket.forEach(loket => tambahBarisLoket(loket));
        });

        // Bantuan Media
        window.changeHelpText = function() {
            let type = document.getElementById('media-type').value;
            let help = document.getElementById('help-text');
            if (type === 'images') help.innerHTML = "Pisahkan URL dengan tanda koma (,) untuk >1 gambar.";
            else if (type === 'youtube') help.innerHTML = "Masukkan <b>ID Video YouTube</b> (Misal: dQw4w9WgXcQ).";
            else if (type === 'gslides') help.innerHTML = "Masukkan link Embed src Google Slides.";
        }

        // Simpan Semua
        window.simpanPengaturan = function() {
            // Ambil array dari input loket, buang yang kosong
            let loketInputs = document.querySelectorAll('.loket-input');
            let arrayLoket = Array.from(loketInputs).map(inp => inp.value.trim()).filter(val => val !== "");
            
            if(arrayLoket.length === 0) { alert("Minimal harus ada 1 loket!"); return; }

            let dataSimpan = {
                marquee: document.getElementById('setting-marquee').value,
                lokets: arrayLoket,
                media: {
                    type: document.getElementById('media-type').value,
                    content: document.getElementById('media-content').value
                }
            };

            set(settingsRef, dataSimpan).then(() => {
                let alertBox = document.getElementById('alertSuccess');
                alertBox.style.display = 'block';
                setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
            });
        }
    </script>
</body>
</html>
